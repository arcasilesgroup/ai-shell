name: check

# CI never learns the language: it runs the same justfile recipes a developer
# does. `just check` is the local gate; on a runner the strict ai-eng doctor is
# INCOMPLETE by design (surface liveness is a machine property), so CI runs the
# recipes and judges doctor the way ai-engineering's own CI judges it: nothing
# may FAIL; "could not be evaluated" is reported, never silently green.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # ai-engineering 1.0.0 is not on PyPI yet (latest there is 0.13.0, which
  # lacks `doctor --ci`), so CI installs the exact commit the repo's
  # .ai/config.toml pin describes. Switch to a PyPI pin when 1.0.0 ships.
  AI_ENG_SHA: '1e803d51ce951ceeb0f8c5bf41ce9412cd0de298'
  JUST_VERSION: '1.58.0'
  GITLEAKS_VERSION: '8.30.1'
  ACTIONLINT_VERSION: '1.7.12'
  # Downloads are checksum-pinned: the version says which release we asked for,
  # the sha256 says the bytes we got are that release.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: install the pinned tools
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint && sudo install actionlint /usr/local/bin/
          uv tool install "rust-just==${JUST_VERSION}"
          uv tool install "ai-engineering @ git+https://github.com/arcasilesgroup/ai-engineering@${AI_ENG_SHA}"

      # The workflows are code, and the most attacked kind. Every action here is
      # pinned to a full commit SHA; actionlint checks what GitHub accepts.
      - name: actionlint
        run: actionlint

      # `--ignore-scripts` is the install-time supply-chain gate: this project's
      # production tree declares zero lifecycle scripts (asserted below), so any
      # future dependency that tries to run code at install time fails here, not
      # on a user's machine. `just security` re-runs the same refusal plus the
      # lockfile audit as part of the gate.
      - name: install with scripts refused
        run: npm ci --ignore-scripts

      - name: the production tree must declare no install scripts
        run: |
          node -e '
          const lock = require("./package-lock.json");
          const prod = Object.entries(lock.packages)
            .filter(([k]) => k.startsWith("node_modules/"))
            .filter(([, v]) => !v.dev);
          const withScripts = prod.filter(([, v]) => v.scripts && Object.keys(v.scripts).length);
          if (withScripts.length) {
            console.error("production deps with lifecycle scripts:", withScripts.map(([k]) => k).join(", "));
            process.exit(1);
          }
          console.log("production dependency tree carries no lifecycle scripts");
          '

      - name: the gate
        shell: bash
        run: |
          ai-eng --json doctor --ci > "$RUNNER_TEMP/doctor.json" || true
          just build lint test security counts
          node - "$RUNNER_TEMP/doctor.json" <<'JS'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const remaining = report.remaining || [];
          const decided = remaining.filter((line) => !line.endsWith("could not be evaluated"));
          console.log(`${report.outcome}: ${decided.length} decided faults, ${remaining.length - decided.length} unanswerable on a runner`);
          for (const line of decided) console.error(`  ${line}`);
          process.exit(decided.length ? 1 : 0);
          JS

  # The release lane cannot be tested by `push`, so the pack contract is proved
  # here on every PR: the exact tarball npm publish would send.
  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack --dry-run
