name: release

# The release loop, in the open-source standard shape (changesets):
#
#   PR with a .changeset/ file  ->  merged to main
#   this workflow               ->  opens/updates a "chore: version packages" PR
#   that PR merged              ->  same workflow publishes to npm and creates
#                                   the GitHub release + tag
#
# No NPM_TOKEN exists anywhere. The publish uses npm OIDC trusted publishing:
# this repo + this workflow file + the "npm" environment are registered once as
# a trusted publisher on npmjs.com, and package.json's
# publishConfig.provenance attaches a signed build attestation to every
# version. A long-lived token on a laptop cannot publish, and there is no
# repository secret to steal.
#
# The "npm" environment is also the human gate: add required reviewers on it in
# repo settings and a release waits for a person before it reaches the
# registry.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # tags + GitHub releases
      pull-requests: write # the version PR
      id-token: write # OIDC for npm trusted publishing + attestations
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # changesets reads history to decide what changed since the last
          # release tag; a shallow clone cannot answer that.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # a release build must never restore a cached npm
      - run: npm ci --ignore-scripts

      # npm's OIDC trusted-publishing exchange landed in CLI 11.5.1; the npm
      # bundled with Node 22 is 10.x, which silently falls back to classic
      # auth and dies with ENEEDAUTH (run 33205361374). Pin a capable npm.
      - name: npm >= 11.5.1 (OIDC trusted publishing)
        run: |
          npm install -g npm@11
          npm --version

      # The action runs publish-script WITHOUT a shell: the command string is
      # split into argv, so `npm run build && npx changeset publish` ran as
      # `npm run build "&&" "npx" "changeset" "publish"` — the extra tokens
      # were swallowed as script arguments (runner banner:
      # `> pkgroll && npx changeset publish`), `changeset publish` never
      # executed, and with ignoreReturnCode the job reported success having
      # published nothing. Build in its own step; keep publish-script a
      # single command.
      - run: npm run build
      - name: release
        id: release
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: npx changeset version
          publish-script: npx changeset publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail closed (constitution 11/12): a green release job whose package
      # version never reached the registry is a lie. The published tarball
      # must exist for the version in package.json.
      - name: the version in package.json must exist on npm
        run: |
          v="$(node -p "require('./package.json').version")"
          npm view "@arcasilesgroup/ai-shell@$v" version
          echo "npm has @arcasilesgroup/ai-shell@$v"
